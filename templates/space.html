{% extends "base.html" %}

{% block body %}
    <h1> Weekly Pictures from Earth and Space</h1>
    {% for date, img in images_data.items() %}
        <h3> {{ date }}: {{ img["title"] }} </h3>
        <img src="{{ img['image'] }}" alt="Astronomy Picture of the Day" >
        <p>{{ img["caption"] }}</p>
        <br>
    {% endfor %}
{% endblock body %}
